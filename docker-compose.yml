services:
  # 后端 API 服务
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flipmemory-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # 显式拼接 URL，确保不为空
      DATABASE_URL: postgresql://postgres:pyu01234@postgres:5432/flipmemory?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: pyu
      MINIO_SECRET_KEY: pyu01234
      MINIO_BUCKET: flipmemory
      MINIO_PUBLIC_ENDPOINT: 139.199.55.169
      MINIO_PUBLIC_PORT: 9002
      JWT_SECRET: flipmemory_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 前端 Web 服务
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flipmemory-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  # PostgreSQL 数据库 (移除宿主机端口绑定 5432，仅内部访问)
  postgres:
    image: postgres:16-alpine
    container_name: flipmemory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pyu01234
      POSTGRES_DB: flipmemory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flipmemory"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 缓存 (移除宿主机端口绑定 6379)
  redis:
    image: redis:7-alpine
    container_name: flipmemory-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO 对象存储
  minio:
    image: minio/minio
    container_name: flipmemory-minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9003:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pyu
      MINIO_ROOT_PASSWORD: pyu01234
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
