<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#grad)"/>
  <g transform="translate(256, 256)">
    <!-- Card shape -->
    <rect x="-120" y="-160" width="240" height="320" rx="20" fill="white" opacity="0.95"/>
    <!-- Flip indicator -->
    <path d="M-60 -100 L60 -100 L60 -60 L-60 -60 Z" fill="#f97316" opacity="0.3" rx="8"/>
    <!-- Camera icon -->
    <circle cx="0" cy="20" r="50" fill="none" stroke="#f97316" stroke-width="8"/>
    <circle cx="0" cy="20" r="25" fill="#f97316"/>
    <rect x="-70" y="-50" width="140" height="20" rx="5" fill="#f97316"/>
  </g>
</svg>
